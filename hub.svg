<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><title>GSNhub</title><foreignObject width="100%" height="100%"><iframe xmlns="http://www.w3.org/1999/xhtml" title="GSNhub launcher" allow="autoplay; fullscreen; gamepad; clipboard-write" allowfullscreen="true" style="position:fixed;inset:0;width:100%;height:100%;border:0;background:#080b13" srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;en&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;&lt;meta name=&quot;theme-color&quot; content=&quot;#080b13&quot;&gt;&lt;title&gt;GSNhub | Choose your world&lt;/title&gt;&lt;link rel=&quot;icon&quot; href=&quot;https://gsnhub01.b-cdn.net/hubs/gsnhub-20261003/logos/hub.svg&quot;&gt;&lt;style&gt;
 *{box-sizing:border-box}html{min-height:100%;background:#080b13}body{margin:0;min-height:100dvh;color:#f3f6fd;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(ellipse at 0 0,#18372588,transparent 54%),radial-gradient(ellipse at 100% 20%,#152b5188,transparent 60%),#080b13}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #b4cdff;outline-offset:5px}header,main,footer{width:min(1180px,90vw);margin:auto}header{padding:35px 0;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:13px;font-size:22px;letter-spacing:-.8px;font-weight:700}.brand img{width:39px;height:39px}.brand span&gt;span{color:#a4bdf1;font-weight:450}header&gt;span{color:#93a0b6;font-size:11px;letter-spacing:1.4px}.hero{padding:55px 0 43px}.eyebrow{font-size:10px;letter-spacing:2.4px;color:#a8bce0;font-weight:600}h1{font-size:clamp(36px,5vw,66px);line-height:1.1;letter-spacing:-2.7px;font-weight:550;max-width:800px;margin:18px 0}p.intro{color:#a9b5cb;font-size:16px;margin:0;max-width:640px}.sites{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.site-card{display:flex;flex-direction:column;position:relative;border:1px solid #dbe6ff20;border-radius:25px;background:linear-gradient(145deg,#c4d9f310,#aebae403);padding:25px 23px;text-align:left;min-width:0;transition:transform .2s,border-color .2s,background .2s}.site-card:hover{transform:translateY(-6px);border-color:var(--accent);background:linear-gradient(145deg,#c4d9f31a,#aebae405)}.site-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:37px}.site-logo{display:grid;place-items:center;width:82px;height:82px;border-radius:23px;background:#d6e7ff09;border:1px solid #e9f2ff12}.site-logo img{width:58px;height:58px;object-fit:contain}.orbit .site-logo img{border-radius:50%;width:63px;height:63px}.arrow{color:var(--accent);font-size:24px;align-self:flex-start}.site-name{font-size:26px;font-weight:600;letter-spacing:-.7px}.site-tag{color:#bac6d9;font-size:12px;min-height:48px;margin-top:9px;line-height:1.65}.site-detail{color:#8c9cb7;font-size:10px;min-height:36px;margin:12px 0 18px}.site-bottom{margin-top:auto;padding-top:19px;border-top:1px solid #dbe6ff14;color:var(--accent);font-size:11px;display:flex;justify-content:space-between;gap:10px}.subtext{display:flex;align-items:center;gap:9px;color:#a0b2ce;font-size:11px;margin:29px 0 52px}.subtext i{width:6px;height:6px;border-radius:50%;background:#a1db91}footer{display:flex;align-items:center;justify-content:space-between;gap:15px;color:#8190aa;font-size:10px;padding:20px 0 26px;border-top:1px solid #e0ebff13}footer span:last-child{color:#a3b4cf}dialog{color:#f5f7fe;background:#111a29;border:1px solid #dbe8ff2b;border-radius:28px;max-width:min(590px,92vw);width:590px;padding:30px;box-shadow:0 30px 120px #000a}dialog::backdrop{background:#02060dba;backdrop-filter:blur(6px)}.dialog-head{display:flex;align-items:center;gap:15px;margin-bottom:26px}.dialog-head img{width:43px;height:43px;object-fit:contain}.dialog-head small{font-size:9px;letter-spacing:2px;color:#a2b7d8}.dialog-head h2{font-size:25px;letter-spacing:-.7px;margin:3px 0 0}.close{margin-left:auto;width:33px;height:33px;display:grid;place-items:center;border-radius:50%;border:1px solid #daeaff20;background:#daeaff08;font-size:22px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:13px}.mode{display:block;border:1px solid #cde1ff25;background:#dceaff08;border-radius:18px;padding:20px;text-align:left;transition:background .18s,border-color .18s}.mode:hover{background:#dceaff15;border-color:#acc7ee}.mode svg{display:block;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;margin-bottom:17px}.mode strong{font-size:14px;display:block;font-weight:550}.mode span{display:block;color:#a2b2cd;font-size:11px;line-height:1.6;margin-top:6px}.mode.primary{color:#101d33;background:#d7e5ff;border-color:#d7e5ff}.mode.primary span{color:#3d5679}.mode.primary:hover{background:#eef5ff}.same-tab{width:100%;margin-top:15px;background:transparent;border:0;border-radius:13px;padding:12px;color:#bfcee4;font-size:12px}.same-tab:hover{background:#dceaff0b}.mode-note{color:#91a5c5;font-size:10px;line-height:1.7;text-align:center;margin:16px 0 0}.error{color:#f7ceaa;font-size:12px;min-height:18px;text-align:center;margin:12px 0 0}.opened{min-height:100dvh;display:grid;place-content:center;text-align:center;padding:30px}.opened img{width:74px;height:74px;object-fit:contain;margin:0 auto 20px}.opened h1{font-size:32px;letter-spacing:-1px}.opened p{color:#aabbd2;font-size:13px}.opened button{padding:12px 20px;background:#dceaff;color:#13223b;border:0;border-radius:22px;margin:auto}.running-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#080b14}@media(max-width:1000px){.sites{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:35px 0}.site-top{margin-bottom:25px}.site-card{padding:24px}.site-tag{min-height:0}.site-detail{min-height:0}}@media(max-width:520px){header{padding:25px 0}header&gt;span{display:none}.hero{padding:25px 0 30px}h1{letter-spacing:-1.4px}.intro{font-size:14px!important}.sites{gap:12px}.site-card{padding:18px;border-radius:20px}.site-logo{width:62px;height:62px;border-radius:18px}.site-logo img,.orbit .site-logo img{width:44px;height:44px}.site-name{font-size:23px}.site-tag{font-size:11px;min-height:54px}.site-detail{font-size:9px;min-height:31px}.site-bottom{font-size:9px;gap:4px}.site-top{margin-bottom:23px}.arrow{font-size:18px}.subtext{font-size:10px;line-height:1.7;margin-bottom:35px}footer{font-size:9px}dialog{padding:24px 20px}.modes{grid-template-columns:1fr}.mode{padding:18px}.mode svg{float:left;margin:3px 17px 23px 0}.mode strong{font-size:13px}.mode span{font-size:10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
