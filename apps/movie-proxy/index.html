<!doctype html><html lang="en"><head><link rel="stylesheet" href="../shared/app-scrollbars.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movie player</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080b12;color:#f3f5fa;font:15px "Segoe UI",sans-serif}#screen{position:fixed;inset:0;width:100%;height:100%;border:0}#connection{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:radial-gradient(ellipse at top,#233148,#080b12 65%);z-index:2;padding:30px}#connection[hidden]{display:none}h1{font-size:26px;font-weight:500}p{color:#a8b4c7;max-width:500px;line-height:1.6}button{border:1px solid #ffffff30;border-radius:24px;background:#ffffff15;color:inherit;padding:12px 22px;font:inherit;cursor:pointer}button:focus-visible{outline:2px solid white;outline-offset:4px}#retry{margin:20px auto 0}#retry[hidden]{display:none}.spinner{width:38px;height:38px;border:2px solid #ffffff18;border-top-color:#fff;border-radius:50%;margin:0 auto;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#home{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:3;background:transparent;border:0;padding:20px 44px;opacity:0;transition:opacity .18s}#home:hover,#home:focus-visible{opacity:1}#home img{width:28px;height:24px;display:block;filter:invert(1)}@media(hover:none){#home{opacity:1}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style><script src="./vendor/jet/jet.core.js"></script><script src="./vendor/jet/jet.api.js"></script><script src="./vendor/jet/jet.utils.js"></script></head><body>
<iframe id="screen" title="Movie streaming player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" referrerpolicy="no-referrer"></iframe>
<section id="connection" role="status"><div class="spinner"></div><h1>Opening your movie</h1><p id="status">Connecting to the streaming service…</p><button id="retry" hidden>Try another connection</button></section>
<button id="home" aria-label="Open Control Center"><img src="../../assets/playstation.svg" alt=""></button>
<script>
if(location.protocol==='file:'){
  document.querySelector('.spinner').hidden=true;
  document.getElementById('status').textContent='The movie proxy needs the local web server. Open Movies from the console instead of opening this file.';
  const link=document.createElement('a');link.textContent='Open PS5 console';link.href='http://127.0.0.1:5176/';link.style.color='white';document.getElementById('connection').append(link);
}
</script>
<script type="module" src="./player.js"></script></body></html>
