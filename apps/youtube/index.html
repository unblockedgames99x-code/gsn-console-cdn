            else if(tab.dataset.tab==="liked")loadLikedTab();
            else loadPrefsTab();
        });
    });
    loadHistoryTab();
}

function loadHistoryTab(){
    var tab=$("libraryTab");tab.innerHTML='<div class="yt-scroll-loader"><div class="yt-spinner"></div></div>';
    fetch(ACCT+"/history?limit=50",{credentials:"same-origin"}).then(function(r){return r.json()}).then(function(d){
        if(!d.history||!d.history.length){tab.innerHTML='<div class="yt-empty">No watch history yet — start watching videos!</div>';return}
        var h='';
        d.history.forEach(function(v){
            h+='<div class="yt-hist-card" data-id="'+esc(v.video_id)+'">'
              +'<div class="yt-hist-thumb">'+(v.thumbnail?'<img src="'+esc(proxyThumb(v.thumbnail))+'" alt="" loading="lazy">':'')+'</div>'
              +'<div class="yt-hist-info"><p class="yt-hist-title">'+esc(v.title)+'</p>'
              +'<div class="yt-hist-meta">'+esc(v.author)+(v.duration?' · '+esc(v.duration):'')+'</div>'
              +'<div class="yt-hist-time">'+timeAgo(v.watched_at)+'</div>'
              +'<button class="yt-hist-remove" data-vid="'+esc(v.video_id)+'">Remove</button>'
              +'</div></div>';
        });
        h+='<div style="padding:20px 0;text-align:center"><button class="yt-filter-btn" id="clearHistBtn" style="margin:0 auto">Clear all history</button></div>';
        tab.innerHTML=h;
        tab.querySelectorAll(".yt-hist-card").forEach(function(c){c.addEventListener("click",function(e){if(e.target.closest(".yt-hist-remove"))return;showWatch(c.dataset.id)})});
        tab.querySelectorAll(".yt-hist-remove").forEach(function(btn){btn.addEventListener("click",function(e){e.stopPropagation();fetch(ACCT+"/history",{method:"DELETE",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({videoId:btn.dataset.vid})}).then(function(){btn.closest(".yt-hist-card").remove()}).catch(function(){})})});
        var clr=$("clearHistBtn");if(clr)clr.addEventListener("click",function(){fetch(ACCT+"/history",{method:"DELETE",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({})}).then(function(){tab.innerHTML='<div class="yt-empty">History cleared</div>'}).catch(function(){})});
    }).catch(function(){tab.innerHTML='<div class="yt-empty">Failed to load history</div>'});
}

function loadLikedTab(){
    var tab=$("libraryTab");tab.innerHTML='<div class="yt-scroll-loader"><div class="yt-spinner"></div></div>';
    fetch(ACCT+"/likes?limit=50",{credentials:"same-origin"}).then(function(r){return r.json()}).then(function(d){
        if(!d.likes||!d.likes.length){tab.innerHTML='<div class="yt-empty">No liked videos yet — hit the like button on videos you enjoy!</div>';return}
        var h='<div class="yt-grid">';
        d.likes.forEach(function(v){h+=renderCard({id:v.video_id,title:v.title,author:v.author,thumbnail:v.thumbnail})});
        h+='</div>';tab.innerHTML=h;bind(tab);
    }).catch(function(){tab.innerHTML='<div class="yt-empty">Failed to load likes</div>'});
}

function loadPrefsTab(){
    var tab=$("libraryTab");tab.innerHTML='<div class="yt-scroll-loader"><div class="yt-spinner"></div></div>';
    fetch(ACCT+"/preferences",{credentials:"same-origin"}).then(function(r){return r.json()}).then(function(d){
        var h='<div class="yt-fade-in" style="max-width:600px">';
        h+='<div style="margin-bottom:24px"><div style="font-size:15px;font-weight:600;margin-bottom:12px;color:#e8e5f4">Top Channels</div>';
        if(d.channels&&d.channels.length){d.channels.forEach(function(c){h+='<div style="display:flex;align-items:center;gap:12px;padding:8px 0"><div class="yt-avatar" style="background:'+avatarColor(c.value)+'">'+initial(c.value)+'</div><span style="font-size:14px;color:#e8e5f4;flex:1">'+esc(c.value)+'</span><span style="font-size:12px;color:#706b8f">'+c.weight+' watches</span></div>'})}
        else h+='<div style="color:#706b8f;font-size:13px">No channel data yet</div>';
        h+='</div>';
        h+='<div style="margin-bottom:24px"><div style="font-size:15px;font-weight:600;margin-bottom:12px;color:#e8e5f4">Top Tags</div>';
        if(d.tags&&d.tags.length){h+='<div style="display:flex;flex-wrap:wrap;gap:8px">';d.tags.forEach(function(t){h+='<span style="background:rgba(200,195,230,.06);border:1px solid rgba(200,195,230,.08);padding:6px 12px;border-radius:8px;font-size:13px;color:#e8e5f4">'+esc(t.value)+' <span style="color:#706b8f">'+t.weight+'</span></span>'});h+='</div>'}
        else h+='<div style="color:#706b8f;font-size:13px">No tag data yet</div>';
        h+='</div>';
        h+='<div style="margin-bottom:24px"><div style="font-size:15px;font-weight:600;margin-bottom:12px;color:#e8e5f4">Categories</div>';
        if(d.categories&&d.categories.length){h+='<div style="display:flex;flex-wrap:wrap;gap:8px">';d.categories.forEach(function(c){h+='<span style="background:rgba(200,195,230,.06);border:1px solid rgba(200,195,230,.08);padding:6px 12px;border-radius:8px;font-size:13px;color:#e8e5f4">'+esc(c.value)+' <span style="color:#706b8f">'+c.weight+'</span></span>'});h+='</div>'}
        else h+='<div style="color:#706b8f;font-size:13px">No category data yet</div>';
        h+='</div>';
        h+='<button class="yt-filter-btn" id="clearPrefsBtn" style="margin-top:12px;color:#e07070;border-color:rgba(224,112,112,.3)">Reset all preferences</button>';
        h+='</div>';tab.innerHTML=h;
        var clr=$("clearPrefsBtn");if(clr)clr.addEventListener("click",function(){fetch(ACCT+"/preferences",{method:"DELETE",credentials:"same-origin"}).catch(function(){});tab.innerHTML='<div class="yt-empty">Preferences reset</div>'});
    }).catch(function(){tab.innerHTML='<div class="yt-empty">Failed to load preferences</div>'});
}

function useEmbed(id){
    var p=document.querySelector(".yt-watch-player");
    if(p)p.innerHTML='<iframe credentialless src="https://www.youtube.com/embed/'+esc(id)+'?autoplay=1&rel=0" style="width:100%;height:100%;border:none;border-radius:14px" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>';
    hideProgress();
}
function showWatch(id){
    showPage("watch");var c=$("watchContainer");
    var m=videoMeta[id]||{};var ch=m.author||"";
    c.innerHTML='<button class="yt-back-btn" id="watchBack"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Back</button>'
        +'<div class="yt-watch-player"><div id="videoLoaderWrap">'+videoLoader()+'</div><video id="watchVideoEl" controls autoplay playsinline></video></div>'
        +'<div class="yt-watch-body"><div class="yt-watch-left">'
        +'<div class="yt-watch-title yt-fade-in" id="watchTitle">'+esc(m.title||id)+'</div><div class="yt-watch-stats" id="watchStats">'+(m.views?'<span>'+fmtViews(m.views)+'</span>':'')+(m.age?'<span>'+esc(m.age)+'</span>':'')+'</div>'
        +'<div class="yt-watch-channel yt-fade-in" id="watchChannel"><div class="yt-watch-channel-avatar" style="background:'+avatarColor(ch)+'">'+initial(ch)+'</div><div><div class="yt-watch-channel-name">'+esc(ch)+'</div></div><div class="yt-watch-actions"><button class="yt-action-btn" id="likeBtn"><svg style="width:18px;height:18px;fill:#a9a3c7" viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>Like</button><button class="yt-action-btn" id="loopBtn"><svg style="width:18px;height:18px;fill:#a9a3c7" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>Loop</button><button class="yt-action-btn" id="transcriptBtn"><svg style="width:18px;height:18px;fill:#a9a3c7" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 10h2v2H6v-2zm0 4h8v2H6v-2zm10 0h2v2h-2v-2zm-6-4h8v2h-8v-2z"/></svg>Transcript</button></div></div>'
        +'<div class="yt-watch-desc" id="watchDesc"></div>'
        +'</div><div class="yt-watch-right"><div class="yt-comments-section" id="watchComments"></div></div></div>';
    watchId=id;watchVideo=$("watchVideoEl");currentVideoInfo=null;
    var embedUsed=false;
    $("watchBack").addEventListener("click",function(){if(watchVideo){watchVideo.pause();watchVideo.src=""}showPage("home")});
    $("watchDesc").addEventListener("click",function(){this.classList.toggle("expanded")});
    $("likeBtn").addEventListener("click",function(){
        var liked=this.classList.toggle("liked");
        var ti=currentVideoInfo||m;
        if(liked)likeOnServer(id,ti.title||m.title||"",ch,ti.thumbnail||m.thumbnail||"");else unlikeOnServer(id);
    });
    $("loopBtn").addEventListener("click",function(){if(watchVideo){watchVideo.loop=!watchVideo.loop;this.classList.toggle("looping",watchVideo.loop);this.innerHTML=(watchVideo.loop?'<svg style="width:18px;height:18px;fill:#c9c1ff" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>Loop On':'<svg style="width:18px;height:18px;fill:#a9a3c7" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>Loop')}});
    $("transcriptBtn").addEventListener("click",function(){loadTranscript(id)});
    showProgress(10);
    watchVideo.addEventListener("canplay",function(){var lw=$("videoLoaderWrap");if(lw)lw.style.display="none"},{once:true});
    watchVideo.addEventListener("error",function(){if(!embedUsed){embedUsed=true;useEmbed(id)}});
    fetch(API+"/info/"+id).then(function(r){return r.ok?r.json():null}).then(function(d){
        if(d&&d.title){
            currentVideoInfo=d;
            trackWatchOnServer(d);
            $("watchTitle").textContent=d.title;
            var st="";if(d.views)st+='<span>'+fmtViews(d.views)+'</span>';if(d.age)st+='<span>'+esc(d.age)+'</span>';if(d.likes)st+='<span>'+fmtViews(d.likes).replace(" views"," likes")+'</span>';
            $("watchStats").innerHTML=st;
            var an=d.author?d.author.name||d.author:"";var subs=d.author&&d.author.subscribers?d.author.subscribers+" subscribers":"";
            if(an){var el=$("watchChannel");if(el){var av=el.querySelector(".yt-watch-channel-avatar");var nm=el.querySelector(".yt-watch-channel-name");if(av){av.style.background=avatarColor(an);av.textContent=initial(an)}if(nm)nm.textContent=an}}
            $("watchDesc").innerHTML='<b>'+fmtViews(d.views)+(d.age?' &middot; '+esc(d.age):'')+'</b><br>'+(d.description?esc(d.description).replace(/\n/g,'<br>'):'No description')+'<br><br><span style="color:#b8b0da">Show less</span>';
            if(d.embedFallback&&!embedUsed){embedUsed=true;useEmbed(id);return}
        } else {
            trackWatchOnServer({id:id,title:m.title||"",author:ch,thumbnail:m.thumbnail||"",tags:[],categories:[]});
        }
    }).catch(function(){
        trackWatchOnServer({id:id,title:m.title||"",author:ch,thumbnail:m.thumbnail||"",tags:[],categories:[]});
    });
    fetch(API+"/ticket/"+id,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:"nocturne-internal"})}).then(function(r){return r.json()}).then(function(t){
        if(t.key){
            watchTicket=t.key;showProgress(85);
            if(!embedUsed){
                watchVideo.src=absApi(API+"/stream/"+id+"?key="+encodeURIComponent(t.key));watchVideo.load();
                var streamTimeout=setTimeout(function(){if(!embedUsed&&watchVideo.readyState<2){embedUsed=true;watchVideo.src="";useEmbed(id)}},15000);
                watchVideo.addEventListener("canplay",function(){clearTimeout(streamTimeout)},{once:true});
            }
            loadComments(id,t.key);hideProgress();
        } else{
            if(!embedUsed){embedUsed=true;useEmbed(id)}
        }
    }).catch(function(){if(!embedUsed){embedUsed=true;useEmbed(id)}});
}

function loadComments(id,ticket){
    var s=$("watchComments");var sk='<div class="yt-comments-header">Comments</div>';for(var i=0;i<4;i++)sk+='<div style="display:flex;gap:12px;margin-bottom:16px"><div class="yt-skel" style="width:36px;height:36px;border-radius:50%;flex-shrink:0"></div><div class="yt-skel-lines" style="flex:1"><div class="yt-skel yt-skel-line w60"></div><div class="yt-skel yt-skel-line w80"></div></div></div>';s.innerHTML=sk;
    fetch(API+"/comments/"+id+"?key="+encodeURIComponent(ticket)+"&max=30").then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
        if(!d.comments||!d.comments.length){s.innerHTML='<div class="yt-comments-header">Comments</div><div class="yt-empty" style="padding:20px">No comments on this video</div>';return}
        var h='<div class="yt-comments-header yt-fade-in">'+d.comments.length+' Comments</div>';
        d.comments.forEach(function(c){var lk=c.likes;if(typeof lk==="number"&&lk>=1000)lk=lk>=1e6?(lk/1e6).toFixed(1)+"M":lk>=1e3?(lk/1e3).toFixed(1)+"K":lk;h+='<div class="yt-comment yt-fade-in"><div class="yt-comment-avi" style="background:'+avatarColor(c.author)+'">'+initial(c.author)+'</div><div class="yt-comment-body"><div class="yt-comment-author"><span>'+esc(c.author)+'</span>'+(c.time?' <span style="color:#706b8f;font-weight:400;margin-left:6px">'+esc(c.time)+'</span>':'')+'</div><div class="yt-comment-text">'+esc(c.text)+'</div>'+(lk?'<div class="yt-comment-likes"><svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>'+lk+'</div>':'')+'</div></div>'});
        s.innerHTML=h;
    }).catch(function(){s.innerHTML='<div class="yt-comments-header">Comments</div><div class="yt-empty" style="padding:20px">Comments unavailable</div>'});
}

function loadTranscript(id){
    if(!watchTicket){var s=$("watchComments");s.innerHTML='<div class="yt-comments-header">Transcript</div><div class="yt-empty" style="padding:20px">Transcript unavailable for this video</div>';return}
    var s=$("watchComments");var sk='<div class="yt-comments-header">Transcript</div>';for(var i=0;i<6;i++)sk+='<div style="display:flex;gap:12px;margin-bottom:12px"><div class="yt-skel" style="width:50px;height:14px"></div><div class="yt-skel yt-skel-line" style="flex:1"></div></div>';s.innerHTML=sk;
    fetch(API+"/transcript/"+id+"?key="+encodeURIComponent(watchTicket)+"&lang=en").then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
        if(!d.transcript||!d.transcript.length){s.innerHTML='<div class="yt-comments-header">Transcript</div><div class="yt-empty" style="padding:20px">No transcript available for this video</div>';return}
        var h='<div class="yt-comments-header yt-fade-in">Transcript</div>';
        d.transcript.forEach(function(c){var m=Math.floor((c.start||0)/60);var sec=Math.round((c.start||0)%60);h+='<div class="yt-fade-in" style="display:flex;gap:12px;padding:8px 0;border-bottom:1px solid rgba(200,195,230,.04)"><span style="color:#b8b0da;min-width:50px;font-size:13px;cursor:pointer">'+m+":"+(sec<10?"0":"")+sec+'</span><span style="font-size:13px;color:#a9a3c7">'+esc(c.text)+'</span></div>'});
        s.innerHTML=h;
    }).catch(function(){s.innerHTML='<div class="yt-comments-header">Transcript</div><div class="yt-empty" style="padding:20px">Transcript unavailable for this video</div>'});
}

document.addEventListener("keydown",function(e){
    if(currentPage==="watch"&&e.key==="Escape"){if(watchVideo){watchVideo.pause();watchVideo.src=""}showPage("home")}
    if(currentPage==="shorts"){
        var c=$("shortsContainer");
        var items=c.querySelectorAll(".yt-shorts-item");
        if(!items.length)return;
        var currentIdx=0;
        items.forEach(function(it,i){var rect=it.getBoundingClientRect();if(rect.top>=0&&rect.top<window.innerHeight/2)currentIdx=i});
        if(e.key==="ArrowDown"||e.key==="j"){e.preventDefault();if(c._scrollToIdx)c._scrollToIdx(currentIdx+1)}
        if(e.key==="ArrowUp"||e.key==="k"){e.preventDefault();if(c._scrollToIdx)c._scrollToIdx(currentIdx-1)}
    }
});

loadAccount();
loadHome();
})();
</script>
