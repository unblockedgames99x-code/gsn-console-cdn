<!doctype html>
<html lang="en"><head><link rel="stylesheet" href="../shared/app-scrollbars.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movies</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e1020;color:#f3f5fa;font:16px system-ui}#screen{position:fixed;inset:0;width:100%;height:100%;border:0}#connection{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;background:radial-gradient(ellipse at top,#302947,#0e1020 65%);padding:32px}#connection[hidden],#retry[hidden]{display:none}#cover{width:120px;height:120px;object-fit:contain}h1{font-size:32px;margin:20px 0 6px}p{color:#acb4c9;max-width:480px;line-height:1.6}button{border:1px solid #ffffff30;border-radius:24px;background:#ffffff15;color:inherit;padding:12px 22px;font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid white;outline-offset:4px}.spinner{width:30px;height:30px;border:2px solid #ffffff20;border-top-color:#85d4fa;border-radius:50%;margin:22px auto 0;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#home{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:3;opacity:0;transition:opacity .18s}#home:hover,#home:focus-visible{opacity:1}#home img{width:26px;height:22px;filter:invert(1)}.credit{font-size:11px;margin-top:26px;color:#8c96af}.credit a{color:inherit}@media(hover:none){#home{opacity:1}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
<script src="./vendor/jet/jet.core.js"></script><script src="./vendor/jet/jet.api.js"></script><script src="./vendor/jet/jet.utils.js"></script>
</head><body>
<!-- Streaming providers inherit restrictions from every ancestor iframe. -->
<iframe id="screen" title="Movies library" allow="autoplay; fullscreen; encrypted-media; picture-in-picture; gamepad; clipboard-write" referrerpolicy="no-referrer"></iframe>
<section id="connection" role="status"><img id="cover" src="../../assets/netflix-icon.webp" alt=""><h1>Movies</h1><div class="spinner"></div><p id="status">Opening your movie library…</p><button id="retry" hidden>Try another connection</button></section>
<button id="home" aria-label="Open Control Center"><img src="../../assets/home.svg" alt=""></button>
<script src="../shared/console-bridge.js"></script><script type="module" src="./player.js"></script>
</body></html>
