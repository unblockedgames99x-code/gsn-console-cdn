    var loadingText = document.querySelector("#loading-text");
    const RAW_ASSET_BASE = "https://raw.githubusercontent.com/genizy/escape-road-3/main/";
    const EXPECTED_TOTAL_BYTES = 170291652;
    let loadedBytes = 0;

    function formatMb(bytes) {
      return (bytes / (1024 * 1024)).toFixed(2);
    }

    function getAssetCandidates(part) {
      return [
        new URL(part.path, RAW_ASSET_BASE).href,
        new URL(part.path, document.baseURI).href
      ];
    }

    async function fetchCandidateWithProgress(url, expectedBytes) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Failed to fetch ${url}: ${response.status}`);
      }
      const reader = response.body.getReader();
      let chunks = [];
      let received = 0;
      while (true) {
        const {
          done,
          value
        } = await reader.read();
        if (done) break;
        received += value.length;
        chunks.push(value);
        loadingText.textContent = `LOADING... ${formatMb(loadedBytes + received)} MB / ${formatMb(EXPECTED_TOTAL_BYTES)} MB`;
      }
      let fullBuffer = new Uint8Array(received);
      let offset = 0;
      for (let chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.length;
      }
      if (expectedBytes && fullBuffer.byteLength !== expectedBytes) {
        throw new Error(`Invalid asset size for ${url}: ${fullBuffer.byteLength} bytes`);
      }
      loadedBytes += fullBuffer.byteLength;
      return fullBuffer.buffer;
    }

    async function fetchWithProgress(part) {
      let lastError;
      for (const url of getAssetCandidates(part)) {
        try {
          return await fetchCandidateWithProgress(url, part.expectedBytes);
        } catch (error) {
          lastError = error;
          console.warn(error);
        }
      }
      throw lastError;
    }

    async function mergeFiles(fileParts, cacheKey, expectedBytes) {
      const cache = await caches.open("gash-cache");
      const cachedResponse = await cache.match(cacheKey);
      if (cachedResponse) {
        const blob = await cachedResponse.blob();
        if (!expectedBytes || blob.size === expectedBytes) {
          loadedBytes += blob.size;
          loadingText.textContent = `LOADING... ${formatMb(loadedBytes)} MB / ${formatMb(EXPECTED_TOTAL_BYTES)} MB`;
          return URL.createObjectURL(blob);
        }
        await cache.delete(cacheKey);
      }
      const buffers = [];
      for (const part of fileParts) {
        buffers.push(await fetchWithProgress(part));
      }
      const mergedBlob = new Blob(buffers);
      if (expectedBytes && mergedBlob.size !== expectedBytes) {
        throw new Error(`Invalid merged asset size for ${cacheKey}: ${mergedBlob.size} bytes`);
      }
      const response = new Response(mergedBlob);
      await cache.put(cacheKey, response);
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, sizes) {
      let parts = [];
      for (let i = 0; i < sizes.length; i++) {
        parts.push({
          path: file + ".part" + (i + 1),
          expectedBytes: sizes[i]
        });
      }
      return parts;
    }
