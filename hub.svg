 &lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;header&gt;&lt;div class=&quot;brand&quot;&gt;&lt;img src=&quot;https://gsnhub01.b-cdn.net/hubs/gsnhub-20261003/logos/hub.svg&quot; alt=&quot;&quot;/&gt;&lt;span&gt;GSN&lt;span&gt;hub&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;span&gt;ONE HUB. EVERY WORLD.&lt;/span&gt;&lt;/header&gt;&lt;main&gt;&lt;section class=&quot;hero&quot;&gt;&lt;span class=&quot;eyebrow&quot;&gt;PICK YOUR NEXT WORLD&lt;/span&gt;&lt;h1&gt;Your next session&lt;br&gt;starts here.&lt;/h1&gt;&lt;p class=&quot;intro&quot;&gt;The console you love. The way you want to play.&lt;br&gt;Choose a site, choose a launch mode, and jump in.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;sites&quot; aria-label=&quot;Choose a site&quot;&gt;&lt;button class=&quot;site-card orbit&quot; data-site=&quot;orbit&quot; style=&quot;--accent:#acb7ff&quot; aria-label=&quot;Launch Orbit&quot;&gt;&lt;span class=&quot;site-top&quot;&gt;&lt;span class=&quot;site-logo&quot;&gt;&lt;img src=&quot;https://gsnhub01.b-cdn.net/hubs/gsnhub-20261003/logos/orbit.svg&quot; alt=&quot;Orbit logo&quot; width=&quot;68&quot; height=&quot;68&quot;/&gt;&lt;/span&gt;&lt;span class=&quot;arrow&quot; aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;site-name&quot;&gt;Orbit&lt;/span&gt;&lt;span class=&quot;site-tag&quot;&gt;Your games, under one sky.&lt;/span&gt;&lt;span class=&quot;site-detail&quot;&gt;Earth &amp; moon · Games &amp; media&lt;/span&gt;&lt;span class=&quot;site-bottom&quot;&gt;Choose launch mode &lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;site-card ps5&quot; data-site=&quot;ps5&quot; style=&quot;--accent:#83b7ff&quot; aria-label=&quot;Launch PS5&quot;&gt;&lt;span class=&quot;site-top&quot;&gt;&lt;span class=&quot;site-logo&quot;&gt;&lt;img src=&quot;https://gsnhub01.b-cdn.net/hubs/gsnhub-20261003/logos/playstation.svg&quot; alt=&quot;PS5 logo&quot; width=&quot;68&quot; height=&quot;68&quot;/&gt;&lt;/span&gt;&lt;span class=&quot;arrow&quot; aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;site-name&quot;&gt;PS5&lt;/span&gt;&lt;span class=&quot;site-tag&quot;&gt;A little space. Unlimited play.&lt;/span&gt;&lt;span class=&quot;site-detail&quot;&gt;PlayStation style · Full library&lt;/span&gt;&lt;span class=&quot;site-bottom&quot;&gt;Choose launch mode &lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;site-card xbox&quot; data-site=&quot;xbox&quot; style=&quot;--accent:#9bd968&quot; aria-label=&quot;Launch Xbox&quot;&gt;&lt;span class=&quot;site-top&quot;&gt;&lt;span class=&quot;site-logo&quot;&gt;&lt;img src=&quot;https://gsnhub01.b-cdn.net/hubs/gsnhub-20261003/logos/xbox.svg&quot; alt=&quot;Xbox logo&quot; width=&quot;68&quot; height=&quot;68&quot;/&gt;&lt;/span&gt;&lt;span class=&quot;arrow&quot; aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;site-name&quot;&gt;Xbox&lt;/span&gt;&lt;span class=&quot;site-tag&quot;&gt;Jump straight into your next game.&lt;/span&gt;&lt;span class=&quot;site-detail&quot;&gt;Xbox style · Games &amp; apps&lt;/span&gt;&lt;span class=&quot;site-bottom&quot;&gt;Choose launch mode &lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;site-card fusion&quot; data-site=&quot;fusion&quot; style=&quot;--accent:#8fdbcb&quot; aria-label=&quot;Launch Fusion&quot;&gt;&lt;span class=&quot;site-top&quot;&gt;&lt;span class=&quot;site-logo&quot;&gt;&lt;img src=&quot;https://gsnhub01.b-cdn.net/hubs/gsnhub-20261003/logos/fusion.svg&quot; alt=&quot;Fusion logo&quot; width=&quot;68&quot; height=&quot;68&quot;/&gt;&lt;/span&gt;&lt;span class=&quot;arrow&quot; aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;site-name&quot;&gt;Fusion&lt;/span&gt;&lt;span class=&quot;site-tag&quot;&gt;The best of green and blue.&lt;/span&gt;&lt;span class=&quot;site-detail&quot;&gt;Xbox + PlayStation · Password required&lt;/span&gt;&lt;span class=&quot;site-bottom&quot;&gt;Choose launch mode &lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;/span&gt;&lt;/button&gt;&lt;/section&gt;&lt;p class=&quot;subtext&quot;&gt;&lt;i aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Your selected site opens directly. Everything else stays unloaded.&lt;/p&gt;&lt;/main&gt;&lt;footer&gt;&lt;span&gt;GSNhub · Games, media, and your space.&lt;/span&gt;&lt;span&gt;Orbit · PS5 · Xbox · Fusion&lt;/span&gt;&lt;/footer&gt;&lt;dialog id=&quot;launch-dialog&quot; aria-labelledby=&quot;site-title&quot;&gt;&lt;div class=&quot;dialog-head&quot;&gt;&lt;img id=&quot;selected-logo&quot; alt=&quot;&quot;/&gt;&lt;div&gt;&lt;small&gt;CHOOSE HOW TO OPEN&lt;/small&gt;&lt;h2 id=&quot;site-title&quot;&gt;&lt;/h2&gt;&lt;/div&gt;&lt;button class=&quot;close&quot; aria-label=&quot;Close launch options&quot;&gt;×&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;modes&quot;&gt;&lt;button class=&quot;mode primary&quot; id=&quot;blank&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M14 3h7v7M21 3 11 13M10 5H4a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-6&quot;/&gt;&lt;/svg&gt;&lt;strong&gt;Open in about:blank&lt;/strong&gt;&lt;span&gt;A fresh tab for your selected site.&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;mode&quot; id=&quot;fullscreen&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M9 3H3v6M15 3h6v6M3 15v6h6M21 15v6h-6&quot;/&gt;&lt;/svg&gt;&lt;strong&gt;Open fullscreen&lt;/strong&gt;&lt;span&gt;Fill your screen. Esc exits fullscreen.&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;button class=&quot;same-tab&quot; id=&quot;same-tab&quot;&gt;Open in this tab →&lt;/button&gt;&lt;p class=&quot;mode-note&quot;&gt;Fusion keeps its password prompt. The launcher disappears when you start.&lt;/p&gt;&lt;p class=&quot;error&quot; id=&quot;status&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;&lt;/dialog&gt;&lt;script&gt;
 const sites=[{&quot;id&quot;:&quot;orbit&quot;,&quot;name&quot;:&quot;Orbit&quot;,&quot;tag&quot;:&quot;Your games, under one sky.&quot;,&quot;detail&quot;:&quot;Earth &amp; moon · Games &amp; media&quot;,&quot;logo&quot;:&quot;orbit.svg&quot;,&quot;color&quot;:&quot;#acb7ff&quot;,&quot;url&quot;:&quot;https://orbitspace.b-cdn.net/releases/beta-20261003-3/gsnhub-v2-earth-console.svg&quot;},{&quot;id&quot;:&quot;ps5&quot;,&quot;name&quot;:&quot;PS5&quot;,&quot;tag&quot;:&quot;A little space. Unlimited play.&quot;,&quot;detail&quot;:&quot;PlayStation style · Full library&quot;,&quot;logo&quot;:&quot;playstation.svg&quot;,&quot;color&quot;:&quot;#83b7ff&quot;,&quot;url&quot;:&quot;https://gsnbeta.b-cdn.net/releases/beta-20261002-1/gsnhub-v2-console.svg&quot;},{&quot;id&quot;:&quot;xbox&quot;,&quot;name&quot;:&quot;Xbox&quot;,&quot;tag&quot;:&quot;Jump straight into your next game.&quot;,&quot;detail&quot;:&quot;Xbox style · Games &amp; apps&quot;,&quot;logo&quot;:&quot;xbox.svg&quot;,&quot;color&quot;:&quot;#9bd968&quot;,&quot;url&quot;:&quot;https://gsnbeta.b-cdn.net/releases/beta-20261002-1/gsnhub-v2-xbox-console.svg&quot;},{&quot;id&quot;:&quot;fusion&quot;,&quot;name&quot;:&quot;Fusion&quot;,&quot;tag&quot;:&quot;The best of green and blue.&quot;,&quot;detail&quot;:&quot;Xbox + PlayStation · Password required&quot;,&quot;logo&quot;:&quot;fusion.svg&quot;,&quot;color&quot;:&quot;#8fdbcb&quot;,&quot;url&quot;:&quot;https://gsnbeta.b-cdn.net/releases/beta-20261003-1/gsnhub-v2-hybrid-console.svg&quot;}],prefix=&quot;https://gsnhub01.b-cdn.net/hubs/gsnhub-20261003/&quot;,dialog=document.getElementById('launch-dialog'),status=document.getElementById('status');let selected;
 const permissions='autoplay; fullscreen; gamepad; encrypted-media; picture-in-picture; clipboard-write; microphone; camera';
 document.querySelectorAll('[data-site]').forEach(button=&gt;button.onclick=()=&gt;{selected=sites.find(site=&gt;site.id===button.dataset.site);document.getElementById('site-title').textContent=selected.name;document.getElementById('selected-logo').src=prefix+'logos/'+selected.logo;status.textContent='';dialog.showModal();});
 document.querySelector('.close').onclick=()=&gt;dialog.close();dialog.onclick=event=&gt;{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX&lt;r.left||event.clientX&gt;r.right||event.clientY&lt;r.top||event.clientY&gt;r.bottom)dialog.close();}};
 document.getElementById('same-tab').onclick=()=&gt;window.top.location.replace(selected.url);
 document.getElementById('fullscreen').onclick=()=&gt;{const site=selected,request=document.documentElement.requestFullscreen?.();dialog.close();const frame=document.createElement('iframe');frame.title=site.name;frame.src=site.url;frame.allow=permissions;frame.allowFullscreen=true;frame.className='running-frame';document.body.replaceChildren(frame);document.body.className='';document.title=site.name;request?.catch(()=&gt;{});};
 document.getElementById('blank').onclick=()=&gt;{const site=selected,child=window.open('about:blank','_blank');if(!child){status.textContent='Allow pop-ups for GSNhub, then try again.';return;}const doc=child.document;doc.title=site.name;doc.documentElement.style.cssText='height:100%;background:#080b14';doc.body.style.cssText='margin:0;height:100%;background:#080b14';const frame=doc.createElement('iframe');frame.title=site.name;frame.src=site.url;frame.allow=permissions;frame.allowFullscreen=true;frame.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;background:#080b14';const full=doc.createElement('button');full.textContent='⛶';full.setAttribute('aria-label','Fullscreen');full.style.cssText='position:fixed;right:16px;bottom:16px;z-index:2;width:38px;height:38px;border:1px solid #ffffff30;border-radius:50%;background:#101928bb;color:white;font:24px system-ui;cursor:pointer';full.onclick=()=&gt;{const r=doc.fullscreenElement?doc.exitFullscreen():doc.documentElement.requestFullscreen();r.catch(()=&gt;{full.title='Fullscreen is unavailable in this browser';});};doc.onfullscreenchange=()=&gt;{full.style.opacity=doc.fullscreenElement?'0.35':'1';};doc.body.append(frame,full);child.opener=null;dialog.close();const panel=document.createElement('main');panel.className='opened';const image=document.createElement('img');image.src=prefix+'logos/'+site.logo;image.alt=site.name;const title=document.createElement('h1');title.textContent=site.name+' is open.';const text=document.createElement('p');text.textContent='Your site is running in the new tab. You can close this launcher.';const close=document.createElement('button');close.textContent='Close launcher';close.onclick=()=&gt;window.top.close();panel.append(image,title,text,close);document.body.replaceChildren(panel);frame.onload=()=&gt;{window.top.close();};};
 &lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe></foreignObject></svg>