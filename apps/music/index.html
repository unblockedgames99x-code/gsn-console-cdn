<!DOCTYPE html>
<html lang="en" data-neo-app="music" data-neo-theme="oled">
<head><link rel="stylesheet" href="../shared/app-scrollbars.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Spotify</title>
  <script src="./neo-lucide.js?v=20260910-clean-play-v1"></script>
  <script type="module" src="./vendor/am-lyrics.min.js?v=20260910"></script>
  <link rel="stylesheet" href="./vendor/meting-ui.css?v=20260910">
  <link rel="stylesheet" href="./vendor/meting-glass.css?v=20260910">
  <style>
    html,body,.main-panel,.content-area,.np-view{background:#000!important}
    body{color:#fff!important}
    .content-area{min-height:0}
    .np-back-btn{position:absolute;top:22px;left:22px;z-index:5;width:42px;height:42px;border:1px solid #252a31;border-radius:50%;background:#111419;color:#f8fafc;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .16s,border-color .16s,transform .16s}
    .np-back-btn:hover{background:#1b2027;border-color:#3a424d;transform:translateX(-2px)}
    .np-back-btn:focus-visible{outline:2px solid #60a5fa;outline-offset:3px}
    .np-back-btn svg{width:21px;height:21px}
    .np-view{position:relative}
    html{scrollbar-width:thin;scrollbar-color:#3b4655 #090b0e}
    *::-webkit-scrollbar{width:8px;height:8px}
    *::-webkit-scrollbar-track{background:#090b0e}
    *::-webkit-scrollbar-thumb{background:#333d4a;border:2px solid #090b0e;border-radius:999px}
    *::-webkit-scrollbar-thumb:hover{background:#4b5a6d}
    .np-extra-controls{width:max-content;max-width:calc(100% - 24px);display:flex;align-items:center;justify-content:center;gap:4px;margin:16px auto 0;padding:5px 7px;border:1px solid #202630;border-radius:14px;background:linear-gradient(180deg,#141820,#0d1015);box-shadow:0 10px 28px #0007,inset 0 1px #ffffff08;color:#94a3b8}
    .np-tool-btn{position:relative;width:32px;height:32px;border:0;border-radius:9px;background:transparent;color:#8d98a8;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:color .15s,background .15s,transform .15s}
    .np-tool-btn:hover{color:#f8fafc;background:#202630}
    .np-tool-btn:active{transform:scale(.92)}
    .np-tool-btn.active{color:#72a9ff;background:#17243a;box-shadow:inset 0 0 0 1px #315b94}
    .np-tool-btn svg{width:16px;height:16px}
    #autoplayBtn{width:40px;height:40px;border:2px solid transparent;border-radius:12px;color:#8d98a8;background:transparent;box-shadow:none}
    #autoplayBtn svg{width:22px;height:22px;stroke-width:2}
    #autoplayBtn:hover{color:#f4f4f5;background:#15171a;box-shadow:none}
    #autoplayBtn[data-repeat-mode="all"]{color:#f4f4f5;background:transparent;box-shadow:none}
    #autoplayBtn[data-repeat-mode="one"]{color:#f4f4f5;border-color:#f4f4f5;background:#111214;box-shadow:0 0 0 1px #0008,inset 0 0 0 1px #ffffff12}
    #autoplayBtn[data-repeat-mode="one"]::after{content:"1";position:absolute;left:50%;top:50%;width:13px;height:13px;border-radius:999px;background:#173553;color:#fff;font:800 8px/13px Inter,Arial,sans-serif;text-align:center;transform:translate(-50%,-50%);box-shadow:0 0 0 1px #8cb7e5}
    #autoplayBtn:focus-visible{outline:2px solid #8cb7e5;outline-offset:3px}
    .volume-control{height:32px;display:flex;align-items:center;gap:4px;padding-right:9px;border-right:1px solid #242a34;margin-right:3px}
    .volume-slider{width:92px;height:18px;margin:0;background:transparent;cursor:pointer;-webkit-appearance:none;appearance:none}
    .volume-slider::-webkit-slider-runnable-track{height:3px;border-radius:99px;background:linear-gradient(90deg,#60a5fa 0 var(--volume-pct,80%),#303743 var(--volume-pct,80%))}
    .volume-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4.5px;border:2px solid #dbeafe;border-radius:50%;background:#60a5fa;box-shadow:0 0 0 3px #60a5fa22}
    .volume-slider::-moz-range-track{height:3px;border:0;border-radius:99px;background:#303743}
    .volume-slider::-moz-range-progress{height:3px;border-radius:99px;background:#60a5fa}
    .volume-slider::-moz-range-thumb{width:9px;height:9px;border:2px solid #dbeafe;border-radius:50%;background:#60a5fa}
    .queue-panel{position:fixed;right:18px;bottom:18px;z-index:30;width:min(360px,calc(100vw - 36px));max-height:55vh;background:#0e1116;border:1px solid #252a31;border-radius:16px;box-shadow:0 20px 60px #000b;display:none;overflow:hidden}
    .queue-panel.visible{display:block}
    .queue-head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid #252a31;font-weight:700}
    .queue-list{overflow:auto;max-height:calc(55vh - 56px);padding:6px;scrollbar-width:thin;scrollbar-color:#3b4655 transparent}
    .queue-item{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}
    .queue-item:hover,.queue-item.playing{background:#191e26}
    .queue-item.playing{color:#60a5fa}
    .queue-item img{width:42px;height:42px;border-radius:7px;object-fit:cover;background:#15181d}
    .queue-meta{min-width:0}.queue-title,.queue-artist{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.queue-title{font-size:13px;font-weight:600}.queue-artist{font-size:11px;color:#7f8998;margin-top:3px}.queue-num{font-size:11px;color:#667080}
    @media(max-width:700px){.np-back-btn{top:12px;left:12px;width:38px;height:38px}}
  </style>
  <link rel="stylesheet" href="./neo-meting-theme.css?v=20260912-proxy-music-v3">
  <link rel="stylesheet" href="./spotify-shell.css?v=20260912-music-brand-logo-v1">
  <script src="./neo-meting-integration.js?v=20260919-scholarnook-v1"></script>
  <link rel="stylesheet" href="./ps5-music.css">
  <link rel="stylesheet" href="./player-dock.css">
</head>
<body>
  <aside class="sidebar" aria-label="Music navigation">
    <div class="music-brand" aria-label="Spotify">
      <span class="music-brand-mark"><img src="../../assets/spotify-official.png" alt="" width="34" height="34"></span>
      <strong>Spotify</strong>
    </div>
    <nav class="music-primary-nav" aria-label="Primary">
      <div class="sb-item active" data-view="home" role="button" tabindex="0"><i data-lucide="home"></i><span>Home</span></div>
      <label class="sidebar-search-shortcut" for="searchInput"><i data-lucide="search"></i><span>Search</span></label>
    </nav>
    <section class="library-panel" aria-labelledby="libraryTitle">
      <div class="library-title-row">
        <div class="sb-item library-link" data-view="library" role="button" tabindex="0"><i data-lucide="library"></i><span id="libraryTitle">Your Library</span></div>
        <button type="button" class="library-add" aria-label="Create playlist"><i data-lucide="plus"></i></button>
      </div>
      <button type="button" class="library-filter">Playlists</button>
      <div class="sb-fav-header" id="sbFavHeader"><i data-lucide="chevron-down"></i><span>Liked songs</span></div>
      <div class="sb-favourites" id="sbFavourites"></div>
    </section>
  </aside>
  <main class="main-panel">
    <header class="top-bar">
      <div class="history-controls" aria-label="Navigation history">
        <button type="button" aria-label="Back" id="musicBackButton"><i data-lucide="chevron-left"></i></button>
        <button type="button" aria-label="Forward" disabled><i data-lucide="chevron-right"></i></button>
      </div>
      <div class="search-wpr"><i data-lucide="search" class="search-icon"></i><input type="text" class="search-input" id="searchInput" autocomplete="off" placeholder="What do you want to play?"></div>
      <button type="button" class="profile-chip" aria-label="Music profile"><span>G</span><strong>Guest</strong></button>
    </header>
    <div class="content-area" id="contentArea">
      <section class="music-welcome" aria-labelledby="musicHomeTitle">
        <p>SPOTIFY</p>
        <h1 id="musicHomeTitle">Good afternoon</h1>
        <div class="music-filter-pills" aria-label="Music filters"><button class="active" type="button">All</button><button type="button">Music</button><button type="button">Playlists</button></div>
      </section>
      <div class="card-grid" id="cardGrid"></div>
    </div>
    <div class="np-view" id="npmView">
      <button class="np-back-btn" id="npmBackBtn" type="button" aria-label="Back to previous page" title="Back to previous page"><i data-lucide="arrow-left"></i></button>
      <div class="np-left">
        <img class="np-cover is-fallback-cover" id="npmCover" src="../../assets/spotify-official.png" alt="">
        <div class="np-details"><div class="np-track-title" id="npmTrackTitle">-</div><div class="np-track-artist" id="npmTrackArtist">-</div></div>
        <div class="np-seek-row"><span class="np-time" id="npmCurrentTime">0:00</span><div class="np-mprogress" id="npmProgressTrack"><div class="np-mprogress-fill" id="npmProgressFill"></div><div class="np-mprogress-handle" id="npmProgressHandle"></div></div><span class="np-time" id="npmDuration">0:00</span></div>
        <div class="np-mcontrols">
          <button class="np-skip-btn" id="npmPrevBtn" aria-label="Previous track"><i data-lucide="skip-back"></i></button>
          <button class="np-skip-btn" id="npmBackTenBtn" aria-label="Back 10 seconds"><i data-lucide="rotate-ccw"></i></button>
          <button class="np-mplay-btn" id="npmPlayBtn" aria-label="Play or pause"><i data-lucide="play"></i></button>
          <button class="np-skip-btn" id="npmFwdTenBtn" aria-label="Forward 10 seconds"><i data-lucide="rotate-cw"></i></button>
          <button class="np-skip-btn" id="npmNextBtn" aria-label="Next track"><i data-lucide="skip-forward"></i></button>
          <button class="np-fav-btn" id="npmFavBtn" aria-label="Favorite"><i data-lucide="heart"></i></button>
        </div>
      </div>
      <div class="np-right"><am-lyrics id="amLyricsEl" song-title="" song-artist="" highlight-color="#60a5fa" font-family="'Inter', sans-serif" autoscroll interpolate hide-source-footer></am-lyrics></div>
    </div>
  </main>
  <footer class="np-inline spotify-player visible" id="npBar" aria-label="Now playing">
    <div class="spotify-track">
      <img id="npThumb" class="np-icon is-fallback-cover" src="../../assets/spotify-official.png" alt="Current album cover">
      <div class="np-inline-meta"><div class="np-title" id="npTitle">Nothing playing</div><div class="np-artist" id="npArtist">Choose something from Home</div></div>
      <button class="player-like" type="button" aria-label="Save track"><i data-lucide="heart"></i></button>
    </div>
    <div class="spotify-transport">
      <div class="spotify-buttons">
        <button class="np-tool-btn" id="autoplayBtn" aria-label="Repeat off" aria-pressed="false" title="Repeat off" data-repeat-mode="off"><i data-lucide="repeat-2"></i></button>
        <button class="np-tool-btn" id="spotifyPrevBtn" aria-label="Previous track"><i data-lucide="skip-back"></i></button>
        <button class="np-play-btn" id="npPlayBtn" aria-label="Play or pause"><i data-lucide="play"></i></button>
        <button class="np-tool-btn" id="spotifyNextBtn" aria-label="Next track"><i data-lucide="skip-forward"></i></button>
        <button class="np-tool-btn" type="button" aria-label="Shuffle"><i data-lucide="shuffle-2"></i></button>
      </div>
      <div class="np-progress" aria-label="Playback progress"><span id="npCurrentTime">0:00</span><div class="spotify-progress-track"><div class="np-progress-fill" id="npProgressFill"></div></div><span id="npDurationInline">0:00</span></div>
    </div>
    <div class="spotify-volume">
      <button class="np-tool-btn" id="queueBtn" aria-label="Open playlist queue" title="Playlist queue"><i data-lucide="list-music"></i></button>
      <button class="np-tool-btn" id="muteBtn" aria-label="Mute"><i data-lucide="volume-2"></i></button>
      <input class="volume-slider" id="volumeSlider" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </div>
  </footer>
  <aside class="queue-panel" id="queuePanel" aria-label="Playlist queue"><div class="queue-head"><span>Up next</span><button class="np-tool-btn" id="queueCloseBtn" aria-label="Close playlist"><i data-lucide="x"></i></button></div><div class="queue-list" id="queueList"></div></aside>
  <script src="./vendor/meting-ui.js?v=20260919-scholarnook-v1"></script>
  <script src="./neo-meting-player.js?v=20260919-scholarnook-v1"></script>
  <script src="./ps5-music.js"></script>
</body>
</html>
